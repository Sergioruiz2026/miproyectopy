<svg width="1600" height="1100" xmlns="http://www.w3.org/2000/svg" style="background-color: white;">
  <defs>
    <style>
      .class-box { fill: white; stroke: #333; stroke-width: 2; }
      .class-title { font-size: 13px; font-weight: bold; font-family: Arial, sans-serif; text-anchor: middle; }
      .class-text { font-size: 9px; font-family: monospace; }
      .attribute-separator { stroke: #333; stroke-width: 1; }
      .relation-line { stroke: #333; stroke-width: 2; fill: none; }
      .relation-label { font-size: 10px; font-weight: bold; font-family: Arial; fill: #000; }
      .title { font-size: 22px; font-weight: bold; font-family: Arial; text-anchor: middle; }
    </style>
  </defs>

  <!-- Título -->
  <text x="800" y="35" class="title">EcoTech Solutions - Diagrama de Clases UML</text>

  <!-- CLASE EMPLEADO -->
  <rect x="50" y="80" width="260" height="280" class="class-box" fill="#d4e6f1"/>
  <text x="180" y="100" class="class-title">Empleado</text>
  <line x1="55" y1="110" x2="305" y2="110" class="attribute-separator"/>
  
  <text x="65" y="125" class="class-text">- idEmpleado: int</text>
  <text x="65" y="140" class="class-text">- nombre: str</text>
  <text x="65" y="155" class="class-text">- direccion: str</text>
  <text x="65" y="170" class="class-text">- telefono: str</text>
  <text x="65" y="185" class="class-text">- correo: str</text>
  <text x="65" y="200" class="class-text">- fechaContrato: date</text>
  <text x="65" y="215" class="class-text">- salario: float</text>
  <text x="65" y="230" class="class-text">- departamento: Depto</text>
  <text x="65" y="245" class="class-text">- proyectos: list</text>
  
  <line x1="55" y1="250" x2="305" y2="250" class="attribute-separator"/>
  
  <text x="65" y="265" class="class-text">+ actualizarDatos()</text>
  <text x="65" y="280" class="class-text">+ asignarDepartamento()</text>
  <text x="65" y="295" class="class-text">+ asignarProyecto()</text>
  <text x="65" y="310" class="class-text">+ quitarProyecto()</text>

  <!-- CLASE DEPARTAMENTO -->
  <rect x="480" y="80" width="280" height="220" class="class-box" fill="#d5f4e6"/>
  <text x="620" y="100" class="class-title">Departamento</text>
  <line x1="485" y1="110" x2="755" y2="110" class="attribute-separator"/>
  
  <text x="495" y="125" class="class-text">- idDepartamento: int</text>
  <text x="495" y="140" class="class-text">- nombre: str</text>
  <text x="495" y="155" class="class-text">- gerente: Empleado</text>
  <text x="495" y="170" class="class-text">- empleados: list[Emp]</text>
  
  <line x1="485" y1="175" x2="755" y2="175" class="attribute-separator"/>
  
  <text x="495" y="190" class="class-text">+ crear()</text>
  <text x="495" y="205" class="class-text">+ editar()</text>
  <text x="495" y="220" class="class-text">+ buscar()</text>
  <text x="495" y="235" class="class-text">+ eliminar()</text>
  <text x="495" y="250" class="class-text">+ agregarEmpleado()</text>
  <text x="495" y="265" class="class-text">+ quitarEmpleado()</text>

  <!-- CLASE PROYECTO -->
  <rect x="950" y="80" width="280" height="220" class="class-box" fill="#fdebd0"/>
  <text x="1090" y="100" class="class-title">Proyecto</text>
  <line x1="955" y1="110" x2="1225" y2="110" class="attribute-separator"/>
  
  <text x="965" y="125" class="class-text">- idProyecto: int</text>
  <text x="965" y="140" class="class-text">- nombre: str</text>
  <text x="965" y="155" class="class-text">- descripcion: str</text>
  <text x="965" y="170" class="class-text">- fechaInicio: date</text>
  <text x="965" y="185" class="class-text">- empleados: list</text>
  <text x="965" y="200" class="class-text">- registrosTiempo: list</text>
  
  <line x1="955" y1="205" x2="1225" y2="205" class="attribute-separator"/>
  
  <text x="965" y="220" class="class-text">+ crear()</text>
  <text x="965" y="235" class="class-text">+ editar()</text>
  <text x="965" y="250" class="class-text">+ eliminar()</text>
  <text x="965" y="265" class="class-text">+ agregarEmpleado()</text>
  <text x="965" y="280" class="class-text">+ quitarEmpleado()</text>

  <!-- CLASE REGISTRO TIEMPO -->
  <rect x="480" y="620" width="280" height="200" class="class-box" fill="#fadbd8"/>
  <text x="620" y="640" class="class-title">RegistroTiempo</text>
  <line x1="485" y1="650" x2="755" y2="650" class="attribute-separator"/>
  
  <text x="495" y="665" class="class-text">- fecha: date</text>
  <text x="495" y="680" class="class-text">- horas: float</text>
  <text x="495" y="695" class="class-text">- descripcion: str</text>
  <text x="495" y="710" class="class-text">- empleado: Empleado</text>
  <text x="495" y="725" class="class-text">- proyecto: Proyecto</text>
  
  <line x1="485" y1="730" x2="755" y2="730" class="attribute-separator"/>
  
  <text x="495" y="745" class="class-text">+ validarHoras()</text>
  <text x="495" y="760" class="class-text">+ registrar()</text>
  <text x="495" y="775" class="class-text">+ editar()</text>

  <!-- CLASE USUARIO -->
  <rect x="50" y="620" width="260" height="150" class="class-box" fill="#ebf5fb"/>
  <text x="180" y="640" class="class-title">Usuario</text>
  <line x1="55" y1="650" x2="305" y2="650" class="attribute-separator"/>
  
  <text x="65" y="665" class="class-text">- idUsuario: int</text>
  <text x="65" y="680" class="class-text">- nombreUsuario: str</text>
  <text x="65" y="695" class="class-text">- contrasenaHash: str</text>
  <text x="65" y="710" class="class-text">- rol: str</text>
  
  <line x1="55" y1="715" x2="305" y2="715" class="attribute-separator"/>
  
  <text x="65" y="730" class="class-text">+ autenticar()</text>
  <text x="65" y="745" class="class-text">+ autorizar()</text>

  <!-- ===== RELACIONES CON CARDINALIDADES ===== -->
  
  <!-- RELACIÓN 1: Departamento 1 a 0 múltiples Empleado -->
  <!-- Línea principal -->
  <line x1="480" y1="190" x2="310" y2="190" class="relation-line"/>
  <!-- Flecha en lado Empleado rectángulo simple -->
  <line x1="310" y1="185" x2="320" y2="190" class="relation-line"/>
  <line x1="310" y1="195" x2="320" y2="190" class="relation-line"/>
  <line x1="310" y1="185" x2="310" y2="195" class="relation-line"/>
  <!-- Notación crow en Departamento para 0 múltiples -->
  <line x1="480" y1="185" x2="470" y2="190" class="relation-line"/>
  <line x1="480" y1="195" x2="470" y2="190" class="relation-line"/>
  <text x="370" y="180" class="relation-label">1</text>
  <text x="420" y="180" class="relation-label">0..*</text>

  <!-- RELACIÓN 2: Empleado 0 múltiples a 0 múltiples Proyecto -->
  <!-- Línea principal -->
  <line x1="310" y1="220" x2="950" y2="220" class="relation-line"/>
  <!-- Notación crow en Empleado para 0 múltiples -->
  <line x1="315" y1="215" x2="305" y2="220" class="relation-line"/>
  <line x1="315" y1="225" x2="305" y2="220" class="relation-line"/>
  <!-- Notación crow en Proyecto para 0 múltiples -->
  <line x1="945" y1="215" x2="955" y2="220" class="relation-line"/>
  <line x1="945" y1="225" x2="955" y2="220" class="relation-line"/>
  <text x="550" y="210" class="relation-label">0..*</text>
  <text x="720" y="210" class="relation-label">0..*</text>

  <!-- RELACIÓN 3: Empleado 1 a 0 múltiples RegistroTiempo -->
  <!-- Línea curva -->
  <path d="M 180 360 Q 280 490 520 620" class="relation-line" fill="none" stroke="#333" stroke-width="2"/>
  <!-- Flecha simple en RegistroTiempo -->
  <line x1="515" y1="615" x2="525" y2="625" class="relation-line"/>
  <line x1="515" y1="625" x2="525" y2="615" class="relation-line"/>
  <!-- Notación crow en RegistroTiempo (para 0..*) -->
  <line x1="518" y1="618" x2="530" y2="628" class="relation-line"/>
  <line x1="520" y1="616" x2="528" y2="630" class="relation-line"/>
  <text x="250" y="450" class="relation-label">1</text>
  <text x="420" y="560" class="relation-label">0..*</text>

  <!-- RELACIÓN 4: Proyecto 1 a 0 múltiples RegistroTiempo -->
  <!-- Línea curva -->
  <path d="M 1090 300 Q 950 460 700 620" class="relation-line" fill="none" stroke="#333" stroke-width="2"/>
  <!-- Flecha simple en RegistroTiempo -->
  <line x1="705" y1="615" x2="695" y2="625" class="relation-line"/>
  <line x1="695" y1="615" x2="705" y2="625" class="relation-line"/>
  <!-- Notación crow en RegistroTiempo (para 0..*) -->
  <line x1="702" y1="618" x2="690" y2="628" class="relation-line"/>
  <line x1="700" y1="616" x2="692" y2="630" class="relation-line"/>
  <text x="1020" y="410" class="relation-label">1</text>
  <text x="810" y="560" class="relation-label">0..*</text>

  <!-- RELACIÓN 5: Usuario - Empleado Asociación -->
  <line x1="180" y1="620" x2="180" y2="360" class="relation-line" stroke-dasharray="5,5"/>
  <text x="200" y="490" class="relation-label" style="font-style: italic;">asociado a</text>

  <!-- LEYENDA -->
  <text x="1300" y="120" style="font-size: 12px; font-weight: bold; font-family: Arial;">Cardinalidades UML:</text>
  
  <line x1="1300" y1="145" x2="1340" y2="145" class="relation-line"/>
  <line x1="1340" y1="140" x2="1330" y2="145" class="relation-line"/>
  <line x1="1340" y1="150" x2="1330" y2="145" class="relation-line"/>
  <text x="1350" y="150" style="font-size: 10px; font-family: Arial;">1 a muchos (composición)</text>
  
  <line x1="1300" y1="180" x2="1340" y2="180" class="relation-line"/>
  <line x1="1345" y1="175" x2="1335" y2="180" class="relation-line"/>
  <line x1="1345" y1="185" x2="1335" y2="180" class="relation-line"/>
  <line x1="1295" y1="175" x2="1305" y2="180" class="relation-line"/>
  <line x1="1295" y1="185" x2="1305" y2="180" class="relation-line"/>
  <text x="1350" y="185" style="font-size: 10px; font-family: Arial;">muchos a muchos</text>
  
  <line x1="1300" y1="215" x2="1340" y2="215" class="relation-line" stroke-dasharray="5,5"/>
  <text x="1350" y="220" style="font-size: 10px; font-family: Arial;">Asociación</text>
</svg>